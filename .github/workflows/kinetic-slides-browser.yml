name: Kinetic Slides Chromium smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'kinetic-slides/**'
      - 'tests/kinetic-slides-browser.mjs'
      - '.github/workflows/kinetic-slides-browser.yml'
  pull_request:
    paths:
      - 'kinetic-slides/**'
      - 'tests/kinetic-slides-browser.mjs'
      - '.github/workflows/kinetic-slides-browser.yml'
  workflow_dispatch:

concurrency:
  group: kinetic-slide-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/projectionlabs-http.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/kinetic-slides/ >/dev/null
      - name: Test animation, navigation, offline HTML and mobile
        run: node tests/kinetic-slides-browser.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-slide-browser-evidence
          path: test-results/kinetic-slides/
          if-no-files-found: ignore
          retention-days: 7
